[build]
  publish = "public"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

# Shadow analysis cycle — every hour from 09:00 to 16:00 BKK on weekdays.
# This function can create approval intents but cannot execute live orders directly.
[functions."autotrade"]
  schedule = "0 2-9 * * 1-5"
  node_bundler = "esbuild"

# Read-only reconciliation every 10 minutes from 10:00 to 16:50 BKK.
# It never retries or creates an order.
[functions."reconcile-orders"]
  schedule = "*/10 3-9 * * 1-5"
  node_bundler = "esbuild"

# Secure Telegram webhook for the single authorized approver.
[functions."telegram"]
  node_bundler = "esbuild"

# Secure Settrade/InnovestX gateway.
[functions."invx"]
  node_bundler = "esbuild"

# Multi-agent AI council (advisory only).
[functions."agents"]
  node_bundler = "esbuild"

# Manual shadow trigger — no execute mode.
[functions."autotrader-trigger"]
  node_bundler = "esbuild"
