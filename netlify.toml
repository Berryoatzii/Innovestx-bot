[build]
  publish = "public"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

# AI advisory cycle — every hour from 09:00 to 16:00 BKK on weekdays.
# It can only explain observations. It creates zero order intents and places zero orders.
[functions."autotrade"]
  schedule = "0 2-9 * * 1-5"
  node_bundler = "esbuild"

# Rules-only post-close shadow research — 17:30 BKK on weekdays.
# It updates a virtual portfolio and evidence ledger only.
[functions."strategy-shadow"]
  schedule = "30 10 * * 1-5"
  node_bundler = "esbuild"

# Read-only reconciliation every 10 minutes from 10:00 to 16:50 BKK.
# It never retries or creates an order.
[functions."reconcile-orders"]
  schedule = "*/10 3-9 * * 1-5"
  node_bundler = "esbuild"

# Secure Telegram webhook for the single authorized approver.
[functions."telegram"]
  node_bundler = "esbuild"

# Secure Settrade/InnovestX gateway.
[functions."invx"]
  node_bundler = "esbuild"

# Multi-agent AI council (advisory only).
[functions."agents"]
  node_bundler = "esbuild"

# Manual advisory/shadow trigger — no execute mode.
[functions."autotrader-trigger"]
  node_bundler = "esbuild"
