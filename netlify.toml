[build]
  publish = "public"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

# Daily operator readiness — 08:15 BKK on weekdays.
[functions."bot-readiness"]
  schedule = "15 1 * * 1-5"
  node_bundler = "esbuild"

# Easy Mode setup and Telegram configuration — 08:20 BKK on weekdays.
[functions."easy-advisor"]
  schedule = "20 1 * * 1-5"
  node_bundler = "esbuild"

# Self-healing Telegram webhook check every 15 minutes from 07:00–18:45 BKK.
# It can only bind to PRIMARY_SITE_URL and cannot accept a caller-supplied URL.
[functions."telegram-keeper"]
  schedule = "*/15 0-11 * * 1-5"
  node_bundler = "esbuild"

# US sector rotation context — 08:35 BKK on weekdays after the US market close.
# Advisory only: relative strength/momentum, never creates an order.
[functions."sector-rotation"]
  schedule = "35 1 * * 1-5"
  node_bundler = "esbuild"

# Frozen RC2 DR forward evidence — 08:45 BKK on SET trading days.
# Public market data only; append-only ledger; never creates an order intent.
[functions."dr-forward-shadow"]
  schedule = "45 1 * * 1-5"
  node_bundler = "esbuild"

# Advanced per-symbol onboarding remains callable manually but is no longer scheduled.
[functions."portfolio-onboarding"]
  node_bundler = "esbuild"

# Quiet AI research cycles — 10:00 and 14:00 BKK on weekdays.
# Telegram debug is opt-in via AI_ADVISORY_VERBOSE=true.
[functions."autotrade"]
  schedule = "0 3,7 * * 1-5"
  node_bundler = "esbuild"

# Evidence-gated deterministic proposals — 10:15 and 14:15 BKK on weekdays.
# Telegram receives Confirm / Reject only when all proposal gates pass.
[functions."rules-proposals"]
  schedule = "15 3,7 * * 1-5"
  node_bundler = "esbuild"

# Rules-only post-close shadow research — 17:30 BKK on weekdays.
[functions."strategy-shadow"]
  schedule = "30 10 * * 1-5"
  node_bundler = "esbuild"

# CORE quality/dividend/value review — Monday 18:15 BKK.
[functions."core-review"]
  schedule = "15 11 * * 1"
  node_bundler = "esbuild"

# ACTIVE backtest refresh — Friday 18:45 BKK.
[functions."research-backtest"]
  schedule = "45 11 * * 5"
  node_bundler = "esbuild"

# Read-only reconciliation every 10 minutes from 10:00 to 16:50 BKK.
[functions."reconcile-orders"]
  schedule = "*/10 3-9 * * 1-5"
  node_bundler = "esbuild"

# Easy Telegram webhook router.
[functions."easy-telegram"]
  node_bundler = "esbuild"

# Advanced Telegram handler retained for approval and diagnostics.
[functions."telegram"]
  node_bundler = "esbuild"

# Secure Settrade/InnovestX gateway.
[functions."invx"]
  node_bundler = "esbuild"

# Multi-agent AI council (advisory only).
[functions."agents"]
  node_bundler = "esbuild"

# Manual advisory/shadow trigger — no execute mode.
[functions."autotrader-trigger"]
  node_bundler = "esbuild"
