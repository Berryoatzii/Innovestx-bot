[build]
  publish = "public"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

# Daily operator readiness — 08:15 BKK on weekdays.
[functions."bot-readiness"]
  schedule = "15 1 * * 1-5"
  node_bundler = "esbuild"

# Portfolio classification reminder — 08:20 BKK on weekdays.
# It only sends buttons for positions that the operator has not classified.
[functions."portfolio-onboarding"]
  schedule = "20 1 * * 1-5"
  node_bundler = "esbuild"

# AI advisory cycle — every hour from 09:00 to 16:00 BKK on weekdays.
# It can only explain observations. It creates zero order intents and places zero orders.
[functions."autotrade"]
  schedule = "0 2-9 * * 1-5"
  node_bundler = "esbuild"

# Evidence-gated deterministic proposals — 10:15 and 14:15 BKK on weekdays.
# It may create expiring human-approval intents only after backtest and shadow gates pass.
[functions."rules-proposals"]
  schedule = "15 3,7 * * 1-5"
  node_bundler = "esbuild"

# Rules-only post-close shadow research — 17:30 BKK on weekdays.
# It updates a virtual portfolio and evidence ledger only.
[functions."strategy-shadow"]
  schedule = "30 10 * * 1-5"
  node_bundler = "esbuild"

# CORE quality/dividend/value review — Monday 18:15 BKK.
# It checks verified fundamentals and approved thesis cards; it creates no orders.
[functions."core-review"]
  schedule = "15 11 * * 1"
  node_bundler = "esbuild"

# ACTIVE backtest refresh — Friday 18:45 BKK.
# It uses next-bar execution and after-cost metrics; it creates no orders.
[functions."research-backtest"]
  schedule = "45 11 * * 5"
  node_bundler = "esbuild"

# Read-only reconciliation every 10 minutes from 10:00 to 16:50 BKK.
# It never retries or creates an order.
[functions."reconcile-orders"]
  schedule = "*/10 3-9 * * 1-5"
  node_bundler = "esbuild"

# Secure Telegram webhook for the single authorized approver.
[functions."telegram"]
  node_bundler = "esbuild"

# Secure Settrade/InnovestX gateway.
[functions."invx"]
  node_bundler = "esbuild"

# Multi-agent AI council (advisory only).
[functions."agents"]
  node_bundler = "esbuild"

# Manual advisory/shadow trigger — no execute mode.
[functions."autotrader-trigger"]
  node_bundler = "esbuild"
