[build]
  publish = "public"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

# Auto Trader watch cycle — every hour from 09:00 to 16:00 BKK on weekdays.
# UTC schedule 02:00-09:00. Default mode remains dry_run unless server locks are deliberately enabled.
[functions."autotrade"]
  schedule = "0 2-9 * * 1-5"
  node_bundler = "esbuild"

# Multi-agent AI council
[functions."agents"]
  node_bundler = "esbuild"

# Manual trigger endpoint — no schedule, HTTP only
[functions."autotrader-trigger"]
  node_bundler = "esbuild"
