name: Trading Safety Tests

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - chatgpt/safety-lock-v1
      - chatgpt/human-approval-v1

permissions:
  contents: read

jobs:
  safety-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run safety tests
        run: npm test
