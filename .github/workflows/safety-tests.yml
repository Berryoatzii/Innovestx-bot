name: Trading Safety Tests

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - chatgpt/safety-lock-v1

permissions:
  contents: read

jobs:
  safety-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run safety tests
        run: npm test
